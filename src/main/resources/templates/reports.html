<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-2">
    <h2>Shopping Mall - Dashboard</h2>
    <form th:action="@{/logout}" method="post">
        <button class="btn btn-sm btn-outline-danger">Logout</button>
    </form>
</div>
<a href="/products" class="btn btn-outline-secondary btn-sm mb-3">Products</a>
<a href="/billing" class="btn btn-outline-primary btn-sm mb-3">Billing Counter</a>
<a href="/sales" class="btn btn-outline-secondary btn-sm mb-3">Sales History</a>

<div class="row g-3 mb-4">
    <div class="col-md-3">
        <div class="card text-bg-primary"><div class="card-body">
            <div>Total Bills</div>
            <h3 th:text="${totalBills}"></h3>
        </div></div>
    </div>
    <div class="col-md-3">
        <div class="card text-bg-success"><div class="card-body">
            <div>Total Revenue</div>
            <h3 th:text="${#numbers.formatDecimal(revenue, 1, 2)}"></h3>
        </div></div>
    </div>
    <div class="col-md-3">
        <div class="card text-bg-info"><div class="card-body">
            <div>GST Collected</div>
            <h3 th:text="${#numbers.formatDecimal(gstCollected, 1, 2)}"></h3>
        </div></div>
    </div>
    <div class="col-md-3">
        <div class="card text-bg-secondary"><div class="card-body">
            <div>Average Bill</div>
            <h3 th:text="${#numbers.formatDecimal(average, 1, 2)}"></h3>
        </div></div>
    </div>
</div>

<p><b>Best-selling item:</b>
    <span th:text="${bestItem}"></span>
    (<span th:text="${bestQty}"></span> units)
    &nbsp;|&nbsp; <b>Total products:</b> <span th:text="${totalProducts}"></span>
</p>

<h4 class="mt-4">Low Stock Alert (<span th:text="${limit}"></span> or fewer left)</h4>
<p th:if="${lowStock.isEmpty()}" class="text-success">All products have enough stock.</p>
<table class="table table-striped" th:unless="${lowStock.isEmpty()}">
    <tr><th>ID</th><th>Name</th><th>Category</th><th>Stock</th></tr>
    <tr th:each="p : ${lowStock}" class="table-warning">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.category}"></td>
        <td th:text="${p.stock}"></td>
    </tr>
</table>
</body>
</html>
