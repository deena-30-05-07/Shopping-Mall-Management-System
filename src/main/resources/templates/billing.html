<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Billing</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h2>Shopping Mall - Billing Counter</h2>
<a href="/products" class="btn btn-outline-secondary btn-sm mb-3">Back to Products</a>

<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

<form th:action="@{/billing}" method="post">
    <div class="mb-3" style="max-width:350px">
        <label class="form-label">Customer name</label>
        <input type="text" name="customerName" class="form-control" placeholder="Walk-in Customer">
    </div>

    <table class="table table-striped">
        <tr><th>ID</th><th>Name</th><th>Price</th><th>In Stock</th><th>Quantity to buy</th></tr>
        <tr th:each="p : ${products}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.price}"></td>
            <td th:text="${p.stock}"></td>
            <td>
                <input type="number" th:name="'qty_' + ${p.id}" value="0" min="0"
                       th:max="${p.stock}" class="form-control form-control-sm" style="width:90px">
            </td>
        </tr>
    </table>

    <button class="btn btn-primary">Generate Bill</button>
</form>
</body>
</html>
