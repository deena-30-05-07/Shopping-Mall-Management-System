<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container" style="max-width:380px; margin-top:100px">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="text-center mb-1">CITY SHOPPING MALL</h3>
            <p class="text-center text-muted">Please sign in</p>

            <div class="alert alert-danger" th:if="${param.error}">Wrong username or password.</div>
            <div class="alert alert-success" th:if="${param.logout}">You have been logged out.</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
