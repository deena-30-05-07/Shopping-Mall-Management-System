<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Products</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-2">
    <h2>Shopping Mall - Products</h2>
    <form th:action="@{/logout}" method="post" class="d-flex align-items-center gap-2">
        <span>Logged in as <b sec:authentication="name"></b></span>
        <button class="btn btn-sm btn-outline-danger">Logout</button>
    </form>
</div>

<a href="/billing" class="btn btn-outline-primary mb-3">Go to Billing Counter</a>
<a href="/sales" class="btn btn-outline-secondary mb-3">Sales History</a>
<a href="/reports" class="btn btn-outline-secondary mb-3" sec:authorize="hasRole('ADMIN')">Dashboard</a>

<form th:action="@{/products}" th:object="${product}" method="post" class="row g-2 mb-4"
      sec:authorize="hasRole('ADMIN')">
    <div class="col"><input th:field="*{name}" class="form-control" placeholder="Name" required></div>
    <div class="col"><input th:field="*{category}" class="form-control" placeholder="Category"></div>
    <div class="col"><input th:field="*{price}" type="number" step="0.01" class="form-control" placeholder="Price" required></div>
    <div class="col"><input th:field="*{stock}" type="number" class="form-control" placeholder="Stock" required></div>
    <div class="col"><button class="btn btn-primary">Add Product</button></div>
</form>

<table class="table table-striped">
    <tr>
        <th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th>
        <th sec:authorize="hasRole('ADMIN')">Action</th>
    </tr>
    <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.category}"></td>
        <td th:text="${p.price}"></td>
        <td th:text="${p.stock}"></td>
        <td sec:authorize="hasRole('ADMIN')">
            <form th:action="@{/products/restock/{id}(id=${p.id})}" method="post" class="d-inline-flex gap-1">
                <input type="number" name="qty" value="1" min="1" class="form-control form-control-sm" style="width:70px">
                <button class="btn btn-sm btn-success">Restock</button>
            </form>
            <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" class="d-inline">
                <button class="btn btn-sm btn-danger">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
