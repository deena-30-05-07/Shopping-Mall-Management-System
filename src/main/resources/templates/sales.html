<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Sales History</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h2>Shopping Mall - Sales History</h2>
<a href="/reports" class="btn btn-outline-secondary btn-sm mb-3" sec:authorize="hasRole('ADMIN')">Dashboard</a>
<a href="/products" class="btn btn-outline-secondary btn-sm mb-3">Products</a>
<a href="/billing" class="btn btn-outline-primary btn-sm mb-3">New Bill</a>

<p th:if="${sales.isEmpty()}" class="text-muted">No sales yet. Create a bill first.</p>

<table class="table table-striped" th:unless="${sales.isEmpty()}">
    <tr><th>Bill No</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th><th></th></tr>
    <tr th:each="s : ${sales}">
        <td th:text="${s.id}"></td>
        <td th:text="${s.customerName}"></td>
        <td th:text="${#temporals.format(s.dateTime, 'dd-MM-yyyy HH:mm')}"></td>
        <td th:text="${s.items.size()}"></td>
        <td th:text="${#numbers.formatDecimal(s.total, 1, 2)}"></td>
        <td><a th:href="@{/bill/{id}(id=${s.id})}" class="btn btn-sm btn-primary">View Bill</a></td>
    </tr>
</table>
</body>
</html>
