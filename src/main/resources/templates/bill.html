<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bill</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div class="text-center">
    <h2>CITY SHOPPING MALL</h2>
    <p>Thank you for shopping with us</p>
</div>

<p>
    <b>Bill No:</b> <span th:text="${sale.id}"></span><br>
    <b>Customer:</b> <span th:text="${sale.customerName}"></span><br>
    <b>Date:</b> <span th:text="${#temporals.format(sale.dateTime, 'dd-MM-yyyy HH:mm')}"></span>
</p>

<table class="table">
    <tr><th>Item</th><th>Price</th><th>Qty</th><th>Total</th></tr>
    <tr th:each="i : ${sale.items}">
        <td th:text="${i.productName}"></td>
        <td th:text="${#numbers.formatDecimal(i.price, 1, 2)}"></td>
        <td th:text="${i.qty}"></td>
        <td th:text="${#numbers.formatDecimal(i.lineTotal, 1, 2)}"></td>
    </tr>
</table>

<table class="table w-50 ms-auto">
    <tr><td>Subtotal</td><td th:text="${#numbers.formatDecimal(sale.subtotal, 1, 2)}"></td></tr>
    <tr><td>GST (18%)</td><td th:text="${#numbers.formatDecimal(sale.gst, 1, 2)}"></td></tr>
    <tr class="table-dark"><td><b>Grand Total</b></td>
        <td><b th:text="${#numbers.formatDecimal(sale.total, 1, 2)}"></b></td></tr>
</table>

<div class="d-print-none mt-3">
    <button class="btn btn-success" onclick="window.print()">Print Bill</button>
    <a href="/billing" class="btn btn-primary">New Bill</a>
    <a href="/products" class="btn btn-outline-secondary">Products</a>
</div>
</body>
</html>
